# Listener
bind: 127.0.0.1
port: 5984

# Slow-client and oversized-header protection
http:
  read_header_timeout: 10s
  read_timeout: 60s
  write_timeout: 5m
  idle_timeout: 2m
  max_header_bytes: 65536

# PostgreSQL Configuration
postgres:
  url: postgres://localhost/couchgres
  pool_size: 16

# Durable _replicator worker
replicator:
  enabled: true
  # Set true to allow public peers. Private peers are always allowed.
  # Loopback and link-local URLs remain blocked.
  allow_public_networks: false

# Admins
#   Plaintext values are pbkdf2-hashed into Postgres
admins:
  admin: change-me

log: info
